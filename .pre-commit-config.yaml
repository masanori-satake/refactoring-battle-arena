repos:
  - repo: local
    hooks:
      - id: python-tests
        name: Python Agent Tests
        description: 全てのエージェントに対してPythonのテストを実行します。
        entry: python -X utf8 -m pytest tests/test_logic.py
        language: node
        pass_filenames: false

      - id: js-tests
        name: JavaScript Tests
        description: JavaScriptのテストを実行します。
        entry: jest
        language: node
        additional_dependencies: [jest@29.7.0]
        pass_filenames: false

      - id: coverage
        name: Python Coverage
        description: Pythonエージェントのカバレッジを測定します。
        entry: python -X utf8 -c "import os, subprocess, sys; os.environ.update({'AGENT_DIR':'original_py'}); subprocess.run([sys.executable, '-X', 'utf8', '-m', 'pytest', '--cov=original_py', 'tests/test_logic.py'], check=True)"
        language: node
        pass_filenames: false
        verbose: true

      - id: mermaid-gen
        name: Generate Mermaid Diagrams
        description: Markdown中のMermaidブロックをPNG画像に変換し、リンクを挿入します。
        entry: python docs/generate_mermaid_images.py
        language: node
        additional_dependencies: ["@mermaid-js/mermaid-cli@11.12.0"]
        pass_filenames: false

      - id: budokai
        name: 天下一武道会 (Tournament)
        description: "Node.jsのセットアップとbudokai.pyの実行を自動化します。"
        entry: python -X utf8 budokai.py
        language: node
        language_version: lts
        pass_filenames: false
        stages: [manual]
        args:
          - --strategy
          - normal
          - --count
          - "50"
        verbose: true
